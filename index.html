<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<title>Outstanding App</title>


<!-- PDF libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f4f6f8;

    color: #1f2937;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    background:
        linear-gradient(
            135deg,
            #1565c0,
            #0d47a1
        );

    color: white;

    padding: 18px 16px;

    text-align: center;

    box-shadow:
        0 2px 8px rgba(0,0,0,.15);

}

.header h1 {

    margin: 0;

    font-size: 22px;

}

.header p {

    margin: 5px 0 0;

    font-size: 13px;

    opacity: .9;

}


/* =========================================================
   CONTAINER
   ========================================================= */

.container {

    max-width: 900px;

    margin: auto;

    padding: 14px;

}


/* =========================================================
   CARD
   ========================================================= */

.card {

    background: white;

    border-radius: 12px;

    padding: 16px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);

}


/* =========================================================
   SEARCH
   ========================================================= */

label {

    display: block;

    font-weight: 600;

    margin-bottom: 7px;

}


.search-box {

    position: relative;

}


#buyerSearch {

    width: 100%;

    padding: 13px 42px 13px 13px;

    border:
        1px solid #cbd5e1;

    border-radius: 9px;

    font-size: 16px;

    outline: none;

    background: white;

}


#buyerSearch:focus {

    border-color:
        #1565c0;

    box-shadow:
        0 0 0 3px
        rgba(21,101,192,.12);

}


.clear-search {

    position: absolute;

    right: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 28px;

    height: 28px;

    border-radius: 50%;

    border: none;

    background: #e5e7eb;

    color: #374151;

    font-size: 18px;

    line-height: 28px;

    padding: 0;

}


/* =========================================================
   BUYER LIST
   ========================================================= */

.buyer-list {

    margin-top: 9px;

    border:
        1px solid #d1d5db;

    border-radius: 9px;

    background: white;

    max-height: 270px;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

}


.buyer-item {

    padding: 13px 12px;

    border-bottom:
        1px solid #edf0f3;

    font-size: 15px;

    cursor: pointer;

    -webkit-tap-highlight-color:
        rgba(21,101,192,.12);

}


.buyer-item:last-child {

    border-bottom: none;

}


.buyer-item:active {

    background: #e8f1ff;

}


.buyer-item.selected {

    background: #dbeafe;

    color: #0d47a1;

    font-weight: 700;

}


.no-buyers {

    padding: 18px;

    text-align: center;

    color: #6b7280;

    font-size: 14px;

}


/* =========================================================
   BUTTONS
   ========================================================= */

button {

    border: none;

    border-radius: 9px;

    padding: 12px 16px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

}


.primary {

    background: #1565c0;

    color: white;

    width: 100%;

    margin-top: 12px;

}


.primary:disabled {

    background: #9ca3af;

}


.pdf-button {

    background: #198754;

    color: white;

    width: 100%;

    margin-top: 10px;

}


.pdf-button:disabled {

    background: #9ca3af;

}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    padding: 10px;

    border-radius: 8px;

    background: #eef4ff;

    color: #1565c0;

    font-size: 14px;

    margin-top: 10px;

}


.error {

    background: #fee2e2;

    color: #b91c1c;

}


/* =========================================================
   SUMMARY
   ========================================================= */

.summary {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 14px;

}


.summary-box {

    background: #f8fafc;

    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    padding: 12px;

}


.summary-label {

    font-size: 12px;

    color: #6b7280;

}


.summary-value {

    font-size: 18px;

    font-weight: 700;

    margin-top: 4px;

}


/* =========================================================
   TABLE
   ========================================================= */

.table-wrap {

    overflow-x: auto;

    margin-top: 15px;

}


table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 650px;

    font-size: 13px;

}


th {

    background: #d9eaf7;

    font-weight: 700;

    padding: 9px;

    border:
        1px solid #cbd5e1;

    text-align: center;

}


td {

    padding: 8px;

    border:
        1px solid #d1d5db;

}


td.center {

    text-align: center;

}


td.amount,
td.days {

    text-align: right;

}


.overdue {

    color: #dc2626;

    font-weight: 700;

}


.total-row {

    background: #e8e8e8;

    font-weight: 700;

}


/* =========================================================
   SECTION
   ========================================================= */

.section-title {

    font-size: 18px;

    margin:
        8px 0 12px;

}


.hidden {

    display: none;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .container {

        padding: 10px;

    }

    .card {

        padding: 13px;

    }

    .summary {

        grid-template-columns:
            1fr 1fr;

    }

}

</style>

</head>


<body>


<div class="header">

    <h1>Outstanding App</h1>

    <p>Buyer Outstanding Report</p>

</div>


<div class="container">


<!-- =======================================================
     BUYER SEARCH
     ======================================================= -->

<div class="card">

    <label for="buyerSearch">
        Search Buyer
    </label>


    <div class="search-box">

        <input
            id="buyerSearch"
            type="text"
            placeholder="Type buyer name..."
            autocomplete="off"
        >


        <button
            id="clearSearch"
            class="clear-search"
            type="button"
        >
            ×
        </button>

    </div>


    <div
        id="buyerList"
        class="buyer-list"
    >

        <div class="no-buyers">
            Loading buyers...
        </div>

    </div>


    <button
        id="loadButton"
        class="primary"
        disabled
    >
        View Outstanding
    </button>


    <div
        id="status"
        class="status"
    >
        Connecting to server...
    </div>

</div>


<!-- =======================================================
     REPORT
     ======================================================= -->

<div
    id="report"
    class="hidden"
>


<!-- SUMMARY -->

<div class="card">

    <h2
        id="buyerTitle"
        class="section-title"
    ></h2>


    <div class="summary">

        <div class="summary-box">

            <div class="summary-label">
                Total Outstanding
            </div>

            <div
                id="totalOutstanding"
                class="summary-value"
            ></div>

        </div>


        <div class="summary-box">

            <div class="summary-label">
                Number of Bills
            </div>

            <div
                id="billCount"
                class="summary-value"
            ></div>

        </div>

    </div>


    <button
        id="pdfButton"
        class="pdf-button"
    >
        Share PDF
    </button>

</div>


<!-- BILLS -->

<div class="card">

    <h2 class="section-title">
        Outstanding Bills
    </h2>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>S.No</th>
                    <th>Supplier</th>
                    <th>Bill Number</th>
                    <th>Bill Date</th>
                    <th>Amount</th>
                    <th>Days Due</th>

                </tr>

            </thead>


            <tbody id="billBody"></tbody>


            <tfoot id="billFoot"></tfoot>

        </table>

    </div>

</div>


<!-- SUPPLIER SUMMARY -->

<div class="card">

    <h2 class="section-title">
        Supplier Wise Summary
    </h2>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>Supplier</th>
                    <th>Total Amount</th>

                </tr>

            </thead>


            <tbody id="supplierBody"></tbody>


            <tfoot id="supplierFoot"></tfoot>

        </table>

    </div>

</div>


</div>


</div>


<script>


// ============================================================
// API
// ============================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxA-kfhKp1DfL_x4uIr82aWntma7dzqwFvKPzFe4AFuOqT48P0Pm-AsiNYGOUWCSx_I/exec";


// ============================================================
// ELEMENTS
// ============================================================

const buyerSearch =
document.getElementById(
    "buyerSearch"
);

const clearSearch =
document.getElementById(
    "clearSearch"
);

const buyerList =
document.getElementById(
    "buyerList"
);

const loadButton =
document.getElementById(
    "loadButton"
);

const statusBox =
document.getElementById(
    "status"
);

const report =
document.getElementById(
    "report"
);

const buyerTitle =
document.getElementById(
    "buyerTitle"
);

const totalOutstanding =
document.getElementById(
    "totalOutstanding"
);

const billCount =
document.getElementById(
    "billCount"
);

const billBody =
document.getElementById(
    "billBody"
);

const billFoot =
document.getElementById(
    "billFoot"
);

const supplierBody =
document.getElementById(
    "supplierBody"
);

const supplierFoot =
document.getElementById(
    "supplierFoot"
);

const pdfButton =
document.getElementById(
    "pdfButton"
);


// ============================================================
// STATE
// ============================================================

let buyers = [];

let filteredBuyers = [];

let selectedBuyer = "";

let currentBuyerData = null;


// ============================================================
// NUMBER FORMAT
// ============================================================

function formatIndianNumber(value) {

    return Number(value || 0)
        .toLocaleString(
            "en-IN",
            {
                maximumFractionDigits: 2
            }
        );

}


// ============================================================
// STATUS
// ============================================================

function setStatus(
    message,
    isError = false
) {

    statusBox.textContent =
        message;

    statusBox.classList.toggle(
        "error",
        isError
    );

}


// ============================================================
// LOAD BUYERS
// ============================================================

async function loadBuyers() {

    try {

        setStatus(
            "Loading buyers..."
        );


        const response =
            await fetch(
                API_URL +
                "?action=buyers"
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        if (data.error) {

            throw new Error(
                data.error
            );

        }


        buyers =
            data.buyers || [];


        filteredBuyers =
            [...buyers];


        renderBuyerList(
            filteredBuyers
        );


        setStatus(
            buyers.length +
            " buyers loaded"
        );


    }
    catch (error) {

        console.error(error);

        setStatus(
            "Unable to connect to backend: " +
            error.message,

            true
        );


        buyerList.innerHTML = `

            <div class="no-buyers">

                Unable to load buyers.

            </div>

        `;

    }

}


// ============================================================
// RENDER BUYER LIST
// ============================================================

function renderBuyerList(
    list
) {

    buyerList.innerHTML = "";


    if (!list.length) {

        buyerList.innerHTML = `

            <div class="no-buyers">

                No buyers found.

            </div>

        `;

        return;

    }


    list.forEach(
        function(buyer) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "buyer-item";


            if (
                buyer === selectedBuyer
            ) {

                item.classList.add(
                    "selected"
                );

            }


            item.textContent =
                buyer;


            item.addEventListener(
                "click",
                function() {

                    selectBuyer(
                        buyer
                    );

                }
            );


            buyerList.appendChild(
                item
            );

        }
    );

}


// ============================================================
// SELECT BUYER
// ============================================================

function selectBuyer(
    buyer
) {

    selectedBuyer =
        buyer;


    buyerSearch.value =
        buyer;


    loadButton.disabled =
        false;


    renderBuyerList(
        filteredBuyers
    );


    setStatus(
        "Buyer selected: " +
        buyer
    );

}


// ============================================================
// SEARCH
// ============================================================

buyerSearch.addEventListener(
    "input",
    function() {

        const query =
            buyerSearch.value
                .trim()
                .toLowerCase();


        selectedBuyer = "";


        filteredBuyers =
            buyers.filter(
                function(buyer) {

                    return buyer
                        .toLowerCase()
                        .includes(query);

                }
            );


        renderBuyerList(
            filteredBuyers
        );


        loadButton.disabled =
            true;


        if (query === "") {

            setStatus(
                buyers.length +
                " buyers loaded"
            );

        }
        else {

            setStatus(
                filteredBuyers.length +
                " matching buyers"
            );

        }

    }
);


// ============================================================
// CLEAR SEARCH
// ============================================================

clearSearch.addEventListener(
    "click",
    function() {

        buyerSearch.value =
            "";

        selectedBuyer =
            "";

        filteredBuyers =
            [...buyers];

        renderBuyerList(
            filteredBuyers
        );

        loadButton.disabled =
            true;

        buyerSearch.focus();

    }
);


// ============================================================
// LOAD BUYER
// ============================================================

loadButton.addEventListener(
    "click",
    loadBuyer
);


async function loadBuyer() {

    if (!selectedBuyer) {

        setStatus(
            "Please select a buyer.",
            true
        );

        return;

    }


    try {

        loadButton.disabled =
            true;


        setStatus(
            "Loading outstanding..."
        );


        const url =
            API_URL +
            "?action=buyer&name=" +
            encodeURIComponent(
                selectedBuyer
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        if (data.error) {

            throw new Error(
                data.error
            );

        }


        currentBuyerData =
            data;


        renderReport(
            data
        );


        setStatus(
            "Report loaded"
        );


    }
    catch (error) {

        console.error(error);

        setStatus(
            "Unable to load buyer: " +
            error.message,

            true
        );

    }
    finally {

        loadButton.disabled =
            false;

    }

}


// ============================================================
// RENDER REPORT
// ============================================================

function renderReport(
    data
) {

    report.classList.remove(
        "hidden"
    );


    buyerTitle.textContent =
        data.buyer;


    totalOutstanding.textContent =
        "₹" +
        formatIndianNumber(
            data.total_outstanding
        );


    billCount.textContent =
        data.bill_count;


    renderBills(
        data.bills || []
    );


    renderSupplierSummary(
        data.supplier_summary || []
    );


    window.scrollTo({

        top:
            report.offsetTop - 10,

        behavior:
            "smooth"

    });

}


// ============================================================
// RENDER BILLS
// ============================================================

function renderBills(
    bills
) {

    billBody.innerHTML =
        "";


    let total = 0;


    bills.forEach(
        function(bill, index) {

            const amount =
                Number(
                    bill.Amount || 0
                );


            const days =
                Number(
                    bill["Days Due"] || 0
                );


            total +=
                amount;


            const row =
                document.createElement(
                    "tr"
                );


            if (days > 120) {

                row.classList.add(
                    "overdue"
                );

            }


            row.innerHTML = `

                <td class="center">
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(
                        bill["Mumbai Party"] || ""
                    )}
                </td>

                <td class="center">
                    ${escapeHtml(
                        String(
                            bill["Bill Number"] || ""
                        )
                    )}
                </td>

                <td class="center">
                    ${escapeHtml(
                        bill["Bill Date"] || ""
                    )}
                </td>

                <td class="amount">
                    ${formatIndianNumber(
                        amount
                    )}
                </td>

                <td class="days">
                    ${days}
                </td>

            `;


            billBody.appendChild(
                row
            );

        }
    );


    billFoot.innerHTML = `

        <tr class="total-row">

            <td></td>
            <td></td>
            <td></td>

            <td style="text-align:right;">
                Grand Total
            </td>

            <td class="amount">
                ${formatIndianNumber(
                    total
                )}
            </td>

            <td></td>

        </tr>

    `;

}


// ============================================================
// SUPPLIER SUMMARY
// ============================================================

function renderSupplierSummary(
    suppliers
) {

    supplierBody.innerHTML =
        "";


    let total = 0;


    suppliers.forEach(
        function(item) {

            const amount =
                Number(
                    item.total || 0
                );


            total +=
                amount;


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.supplier || ""
                    )}
                </td>

                <td class="amount">
                    ${formatIndianNumber(
                        amount
                    )}
                </td>

            `;


            supplierBody.appendChild(
                row
            );

        }
    );


    supplierFoot.innerHTML = `

        <tr class="total-row">

            <td>
                Grand Total
            </td>

            <td class="amount">
                ${formatIndianNumber(
                    total
                )}
            </td>

        </tr>

    `;

}


// ============================================================
// CREATE PDF
// ============================================================

pdfButton.addEventListener(
    "click",
    sharePDF
);


async function sharePDF() {

    if (!currentBuyerData) {

        return;

    }


    try {

        pdfButton.disabled =
            true;

        pdfButton.textContent =
            "Creating PDF...";


        const {
            jsPDF
        } = window.jspdf;


        const data =
            currentBuyerData;


        const doc =
            new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4"
            });


        const buyerName =
            data.buyer || "Buyer";


        const fileName =
            buyerName +
            " Outstanding List.pdf";


        // ----------------------------------------------------
        // TITLE
        // ----------------------------------------------------

        doc.setFont(
            "helvetica",
            "bold"
        );

        doc.setFontSize(16);

        doc.text(
            "Outstanding List",
            105,
            12,
            {
                align: "center"
            }
        );


        // ----------------------------------------------------
        // BUYER
        // ----------------------------------------------------

        doc.setFillColor(
            21,
            101,
            192
        );


        doc.rect(
            10,
            16,
            190,
            9,
            "F"
        );


        doc.setTextColor(
            255,
            255,
            255
        );


        doc.setFontSize(12);


        doc.text(
            buyerName,
            105,
            22,
            {
                align: "center"
            }
        );


        doc.setTextColor(
            0,
            0,
            0
        );


        // ----------------------------------------------------
        // DATE / CONTACT
        // ----------------------------------------------------

        const today =
            new Date()
                .toLocaleDateString(
                    "en-GB"
                );


        doc.setFont(
            "helvetica",
            "normal"
        );

        doc.setFontSize(8);


        doc.text(
            today +
            "    PK AGENCY - 9425436227, 9406600197",
            105,
            30,
            {
                align: "center"
            }
        );


        // ----------------------------------------------------
        // BILL TABLE
        // ----------------------------------------------------

        const billRows =
            data.bills.map(
                function(bill, index) {

                    return [

                        index + 1,

                        bill["Mumbai Party"] ||
                            "",

                        String(
                            bill["Bill Number"] ||
                            ""
                        ),

                        bill["Bill Date"] ||
                            "",

                        formatIndianNumber(
                            bill.Amount
                        ),

                        String(
                            bill["Days Due"] ||
                            0
                        )

                    ];

                }
            );


        const total =
            Number(
                data.total_outstanding ||
                0
            );


        doc.autoTable({

            startY: 34,

            head: [[

                "S.No",

                "Supplier",

                "Bill Number",

                "Bill Date",

                "Amount",

                "Days Due"

            ]],

            body:
                billRows,

            foot: [[

                "",

                "",

                "",

                "Grand Total",

                formatIndianNumber(
                    total
                ),

                ""

            ]],

            theme:
                "grid",

            styles: {

                font:
                    "helvetica",

                fontSize:
                    7,

                cellPadding:
                    2,

                lineColor:
                    [170,170,170],

                lineWidth:
                    .15

            },

            headStyles: {

                fillColor:
                    [217,234,247],

                textColor:
                    [0,0,0],

                fontStyle:
                    "bold",

                halign:
                    "center"

            },

            footStyles: {

                fillColor:
                    [232,232,232],

                textColor:
                    [0,0,0],

                fontStyle:
                    "bold"

            },

            columnStyles: {

                0: {
                    halign: "center",
                    cellWidth: 12
                },

                1: {
                    cellWidth: 48
                },

                2: {
                    halign: "center",
                    cellWidth: 25
                },

                3: {
                    halign: "center",
                    cellWidth: 24
                },

                4: {
                    halign: "right",
                    cellWidth: 35
                },

                5: {
                    halign: "right",
                    cellWidth: 20
                }

            },

            didParseCell:
                function(hookData) {

                    if (
                        hookData.section ===
                        "body"
                        &&
                        hookData.column.index === 5
                    ) {

                        const days =
                            Number(
                                data.bills[
                                    hookData.row.index
                                ]["Days Due"] ||
                                0
                            );


                        if (days > 120) {

                            hookData.cell.styles.textColor =
                                [220,38,38];

                            hookData.cell.styles.fontStyle =
                                "bold";

                        }

                    }

                }

        });


        // ----------------------------------------------------
        // SUPPLIER SUMMARY
        // ----------------------------------------------------

        let finalY =
            doc.lastAutoTable.finalY +
            10;


        if (finalY > 265) {

            doc.addPage();

            finalY = 15;

        }


        doc.setFont(
            "helvetica",
            "bold"
        );

        doc.setFontSize(11);


        doc.text(
            "Supplier Wise Summary",
            10,
            finalY
        );


        const supplierRows =
            data.supplier_summary.map(
                function(item) {

                    return [

                        item.supplier ||
                            "",

                        formatIndianNumber(
                            item.total
                        )

                    ];

                }
            );


        supplierRows.push([

            "Grand Total",

            formatIndianNumber(
                total
            )

        ]);


        doc.autoTable({

            startY:
                finalY + 4,

            head: [[

                "Supplier",

                "Total Amount"

            ]],

            body:
                supplierRows,

            theme:
                "grid",

            styles: {

                fontSize:
                    8,

                cellPadding:
                    2

            },

            headStyles: {

                fillColor:
                    [217,234,247],

                textColor:
                    [0,0,0],

                fontStyle:
                    "bold"

            },

            columnStyles: {

                0: {
                    cellWidth: 110
                },

                1: {
                    halign: "right",
                    cellWidth: 60
                }

            },

            didParseCell:
                function(hookData) {

                    if (
                        hookData.section ===
                        "body"
                        &&
                        hookData.row.index ===
                        supplierRows.length - 1
                    ) {

                        hookData.cell.styles.fillColor =
                            [232,232,232];

                        hookData.cell.styles.fontStyle =
                            "bold";

                    }

                }

        });


        // ----------------------------------------------------
        // CREATE BLOB
        // ----------------------------------------------------

        const pdfBlob =
            doc.output(
                "blob"
            );


        const pdfFile =
            new File(
                [
                    pdfBlob
                ],
                fileName,
                {
                    type:
                        "application/pdf"
                }
            );


        // ----------------------------------------------------
        // IPHONE SHARE
        // ----------------------------------------------------

        if (
            navigator.share
            &&
            navigator.canShare
            &&
            navigator.canShare({
                files: [pdfFile]
            })
        ) {

            await navigator.share({

                title:
                    buyerName +
                    " Outstanding List",

                text:
                    buyerName +
                    " Outstanding List",

                files: [
                    pdfFile
                ]

            });


            setStatus(
                "PDF shared successfully"
            );

        }

        else {

            // ------------------------------------------------
            // FALLBACK DOWNLOAD
            // ------------------------------------------------

            const url =
                URL.createObjectURL(
                    pdfBlob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                fileName;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );


            setStatus(
                "PDF downloaded as: " +
                fileName
            );

        }

    }
    catch (error) {

        console.error(error);


        if (
            error.name ===
            "AbortError"
        ) {

            setStatus(
                "PDF sharing cancelled"
            );

        }
        else {

            setStatus(
                "PDF error: " +
                error.message,

                true
            );

        }

    }
    finally {

        pdfButton.disabled =
            false;

        pdfButton.textContent =
            "Share PDF";

    }

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

loadBuyers();
